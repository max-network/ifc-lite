name: Set up the max-network workspace
description: Node 22, pnpm through corepack, the locked install and the prebuilt wasm.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22

    - name: Enable pnpm
      shell: bash
      run: corepack enable

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Fetch the prebuilt wasm
      shell: bash
      run: pnpm build:wasm:fetch
